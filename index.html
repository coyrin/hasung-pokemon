<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>하성의 포켓몬 월드</title>
<meta name="description" content="하성의 아침 루틴과 공부, 스티커를 모으는 포켓몬 대시보드">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="포켓몬 월드">
<meta name="theme-color" content="#bfe3ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
<div id="app">
  <header class="topbar">
    <nav class="tabs" id="tabs" aria-label="메뉴">
      <button class="tab" data-view="pokemon" type="button"><span class="ball"></span>포켓몬</button>
      <button class="tab is-active" data-view="dashboard" type="button"><span class="tab-ico">🏠</span>대시보드</button>
      <button class="tab" data-view="study" type="button"><span class="tab-ico">📚</span>하성 공부</button>
      <button class="tab" data-view="tasks" type="button"><span class="tab-ico">✅</span>할 일</button>
      <button class="tab" data-view="timer" type="button"><span class="tab-ico">⏱️</span>정리 타이머</button>
      <button class="tab" data-view="memo" type="button"><span class="tab-ico">💬</span>가족 메모</button>
    </nav>
    <button class="settings-btn" id="btn-settings" type="button" aria-label="부모 설정" title="부모 설정">
      <span aria-hidden="true">⚙️</span>
    </button>
  </header>

  <main id="main">
    <section class="view is-active" id="view-dashboard" aria-label="대시보드"></section>
    <section class="view" id="view-pokemon" aria-label="포켓몬"></section>
    <section class="view" id="view-study" aria-label="하성 공부"></section>
    <section class="view" id="view-tasks" aria-label="할 일"></section>
    <section class="view" id="view-timer" aria-label="정리 타이머"></section>
    <section class="view" id="view-memo" aria-label="가족 메모"></section>
  </main>
</div>

<div id="modal-root" class="modal-root" aria-live="polite"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<div id="fx-root" class="fx-root" aria-hidden="true"></div>

<noscript><p style="padding:24px;font-size:20px">이 화면을 보려면 자바스크립트를 켜 주세요.</p></noscript>

<script src="js/data.js?v=5"></script>
<script src="js/store.js?v=5"></script>
<script src="js/ui.js?v=5"></script>
<script src="js/sound.js?v=5"></script>
<script src="js/pokeapi.js?v=5"></script>
<script src="js/weather.js?v=5"></script>
<script src="js/view-dashboard.js?v=5"></script>
<script src="js/view-tasks.js?v=5"></script>
<script src="js/view-study.js?v=5"></script>
<script src="js/view-timer.js?v=5"></script>
<script src="js/view-pokemon.js?v=5"></script>
<script src="js/view-memo.js?v=5"></script>
<script src="js/settings.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
